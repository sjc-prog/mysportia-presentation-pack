<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Kizzem">
  <!-- One-colour navy. What invoices, documents and one-colour print use.
       Stroke geometry is identical to the colour version so they stay the
       same mark. Swap #0D1B33 for #FFFFFF on dark grounds. -->
  <path d="M34 16 L28 84" fill="none" stroke="#0D1B33" stroke-width="19" stroke-linecap="round"/>
  <path d="M80 20 L48 50 L80 80" fill="none" stroke="#0D1B33" stroke-width="19" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
